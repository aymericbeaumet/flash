[package]
name = "flash-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight tokio length-prefixed MessagePack scaffolding for Flash plugins (macOS)."

[dependencies]
serde_json = "1"
rmp-serde = "1"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "process",
  "time",
  "sync",
] }
