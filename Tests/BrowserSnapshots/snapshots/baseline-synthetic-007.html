<!doctype html>
<html lang="en">
<head>

<title>baseline-synthetic-007</title>
<style>
:root { color-scheme: light; }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #1f2933; background: #f8fafc; }
header, main, footer { max-width: 1120px; margin: 0 auto; padding: 18px 24px; }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.menu { display: flex; flex-direction: column; gap: 6px; }
.hero { background: #e8f3ff; border: 1px solid #b7d7f8; padding: 18px; border-radius: 6px; }
.hidden { display: none; }
.visually-hidden { position: absolute; left: -9999px; top: -9999px; }
.spacer { height: 900px; }

</head>
