# The documentation site at https://aymericbeaumet.github.io/flash/, built
# from docs/ by .github/workflows/pages.yml. Preview locally with:
#   uvx --with mkdocs-material==9.7.7 mkdocs serve
site_name: Flash
site_description: Your keyboard, all of macOS.
site_url: https://aymericbeaumet.github.io/flash/
repo_url: https://github.com/aymericbeaumet/flash
repo_name: aymericbeaumet/flash
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  assets/README.md

nav:
  - Home: README.md
  - Using Flash:
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - Commands: commands.md
      - Normal mode: normal-mode.md
      - flashlight: flashlight.md
      - Windows: windows.md
      - Audio devices: audio.md
      - Privacy: privacy.md
      - Troubleshooting: troubleshooting.md
      - Browser help: help.md
  - Status bar and widgets:
      - Status format: status-format.md
      - Status plugins: status-plugins.md
      - Widgets: widgets.md
      - Popups: popups.md
      - Calendar: calendar.md
      - Examples:
          - Status bar: examples/statusbar/README.md
          - Widgets: examples/widgets/README.md
  - Alternatives:
      - Overview: alternatives/README.md
      - Hint and pointer tools:
          - Neru: alternatives/neru.md
          - Homerow: alternatives/homerow.md
          - Shortcat: alternatives/shortcat.md
          - Scoot: alternatives/scoot.md
          - Vimac: alternatives/vimac.md
          - Mouseless: alternatives/mouseless.md
          - Wooshy: alternatives/wooshy.md
          - Superkey: alternatives/superkey.md
          - warpd: alternatives/warpd.md
      - Browser extensions:
          - Vimium: alternatives/vimium.md
          - Surfingkeys: alternatives/surfingkeys.md
      - Automation and launchers:
          - Hammerspoon: alternatives/hammerspoon.md
          - Raycast: alternatives/raycast.md
          - Alfred: alternatives/alfred.md
      - Bars and widgets:
          - SketchyBar: alternatives/sketchybar.md
          - Übersicht: alternatives/uebersicht.md
          - conky: alternatives/conky.md
      - Window managers:
          - AeroSpace: alternatives/aerospace.md
          - yabai: alternatives/yabai.md
          - Rectangle: alternatives/rectangle.md
      - Migration guides:
          - From Hammerspoon: hammerspoon.md
          - From Neverclick: neverclick.md
          - From mousemaster: mousemaster.md
          - Neverclick example: examples/neverclick/README.md
          - mousemaster example: examples/mousemaster/README.md
      - Comparison table and FAQ: comparison.md
  - Plugins:
      - Cookbook: plugin-cookbook.md
      - Protocol: plugin-protocol.md
      - Rust SDK: plugin-rust-sdk.md
      - Performance: plugin-performance.md
  - Contributing:
      - Development: development.md
      - Releases and notarization: release.md
      - Architecture: architecture.md
      - Prepared model: prepared-model.md
      - Observability: observability.md
      - Performance: performance.md
