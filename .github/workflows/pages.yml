name: Docs

# docs/*.md is the one source of the manual. The resident serves it at
# /docs/<page>; this publishes the same docs view, prerendered page by page
# by `mise run build:site` (Scripts/build-site.sh), at
# https://aymericbeaumet.github.io/flash/.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Inspector/**"
      - "Scripts/build-site.sh"
      - "Scripts/_common.sh"
      - "mise.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Inspector/**"
      - "Scripts/build-site.sh"
      - "Scripts/_common.sh"
      - "mise.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  # Each job's mise-action installs only the tools its tasks need.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: node pnpm
      - name: Build the site
        run: mise run build:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
