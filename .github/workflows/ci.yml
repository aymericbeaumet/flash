name: CI

on:
  push:
    branches: [main]
    tags:
      - "*.*.*"
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  format:
    name: Format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show swift-format version
        run: swift format --version
      - name: Check formatting
        # Run the formatter in-place, then require a clean working tree.
        # No `.swift-format` config in the repo — Apple's default rules
        # are the source of truth.
        run: |
          swift format format --in-place --recursive Sources Tests Package.swift
          git diff --exit-code

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show swift-format version
        run: swift format --version
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

  guardrails:
    name: Guardrails
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.11
          install_args: python
      - name: Check hard-rule guardrails
        run: ./Scripts/check-guardrails.sh
      - name: Test release publication
        run: bash Scripts/test-publish-github-release.sh

  plugin-gate:
    name: Plugins (gate)
    runs-on: macos-26
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/plugin-target
    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo registry + plugin target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/plugin-target
          key: ${{ runner.os }}-plugin-cargo-${{ hashFiles('Plugins/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-plugin-cargo-
      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.11
          install_args: python rust
      - name: Plugin gate
        # Scripts/test-plugins.sh --lane all is the whole Rust gate: `lint`
        # (fmt --check + clippy -D warnings) and `units` (the plugin-publication
        # test plus per-crate `cargo test --locked`, where the SDK's
        # wire/runtime suites and its probe member are the protocol conformance
        # authority) over the SDK workspace and every plugin crate, then `build`
        # (a dev build of every executable plugin). `--locked` doubles as the
        # committed-Cargo.lock freshness gate. Coverage is by glob: a new plugin
        # crate is exercised by construction, never by editing this file.
        run: ./Scripts/test-plugins.sh --lane all

  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.11
          install_args: python zig
      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          # Only the stamped XCFramework is read on a hit; the source tree and
          # per-architecture Zig outputs (~400 MB) are rebuilt on a miss. The
          # script pins the Ghostty revision and the Zig version it accepts.
          path: build/ghostty/ghostty-vt.xcframework
          key: ${{ runner.os }}-${{ runner.arch }}-ghostty-${{ hashFiles('Scripts/build-ghostty.sh') }}
      - name: Build libghostty-vt
        run: ./Scripts/build-ghostty.sh --dev
      - name: Show Swift version
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-
      - name: Build
        run: swift build

  test:
    name: Test
    runs-on: macos-26
    env:
      TMUX_ORACLE: ${{ github.workspace }}/build/tmux-oracle/bin/tmux
      FLASH_REQUIRE_TMUX_ORACLE: '1'
      FLASH_REQUIRE_PLUGIN_BINARIES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.11
          install_args: python rust zig
      - name: Install tmux oracle build dependencies
        run: brew install libevent ncurses pkg-config
      - name: Cache pinned tmux oracle
        uses: actions/cache@v6
        with:
          path: build/tmux-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-tmux-oracle-${{ hashFiles('Scripts/build-tmux-oracle.sh') }}
      - name: Build pinned tmux oracle
        run: |
          ./Scripts/build-tmux-oracle.sh
          echo "$GITHUB_WORKSPACE/build/tmux-oracle/bin" >> "$GITHUB_PATH"
      - name: Check native format expansion oracle
        run: python3 Scripts/test-status-format-oracle.py
      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          # Only the stamped XCFramework is read on a hit; the source tree and
          # per-architecture Zig outputs (~400 MB) are rebuilt on a miss. The
          # script pins the Ghostty revision and the Zig version it accepts.
          path: build/ghostty/ghostty-vt.xcframework
          key: ${{ runner.os }}-${{ runner.arch }}-ghostty-${{ hashFiles('Scripts/build-ghostty.sh') }}
      - name: Build libghostty-vt
        run: ./Scripts/build-ghostty.sh --dev
      - name: Show Swift version
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-test-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-test-
      - name: Cache Cargo registry + plugin target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/plugin-target
          key: ${{ runner.os }}-plugin-cargo-${{ hashFiles('Plugins/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-plugin-cargo-
      - name: Build plugin binaries
        # Every executable plugin: the sandbox boot test launches each one
        # under its generated profile, and FLASH_REQUIRE_PLUGIN_BINARIES turns
        # an unbuilt plugin into a failure instead of a skip. The subprocess
        # smoke tests drive spotify (mocked CLI) and answers (stdin EOF), and
        # doctor inspects media.
        run: ./Scripts/build-plugins.sh dev
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/plugin-target
      - name: Test
        run: swift test

  inspector:
    name: Inspector
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.11
          install_args: node pnpm
      - name: Install inspector deps
        working-directory: Inspector
        run: pnpm install --frozen-lockfile
      - name: Type-check inspector
        working-directory: Inspector
        run: pnpm check
      - name: Run inspector unit tests
        working-directory: Inspector
        run: node --test *.test.ts
      - name: Build inspector bundle
        working-directory: Inspector
        run: pnpm build
      - name: Stage bundle as SwiftPM resource
        run: cp Inspector/dist/index.html Sources/flash/Resources/inspector.html
      - name: Require committed bundle to be up to date
        # The committed resource must match a fresh build of Inspector/.
        # If this fails, run Scripts/build-inspector.sh and commit the result.
        run: git diff --exit-code Sources/flash/Resources/inspector.html

  homebrew:
    name: Homebrew
    runs-on: macos-26
    # plugin-gate is REQUIRED: a failed plugin gate must never ship a release.
    needs: [format, lint, guardrails, build, test, inspector, plugin-gate]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure deployment
        id: meta
        run: |
          # A push to main whose Resources/Info.plist version has no tag yet
          # cuts that version: the release is created at this commit, which
          # also creates the tag (a tag made with the workflow token does not
          # start a second run). Every other main push gets an immutable
          # versioned nightly release, while the nightly cask keeps rolling.
          # A tag pushed by hand builds that version too. See docs/release.md.
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          prerelease="false"
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]] \
            && ! git ls-remote --exit-code --tags origin "refs/tags/$plist_version" >/dev/null; then
            version="$plist_version"
            release_tag="$plist_version"
            cask_token="flash"
            asset_name="Flash-${version}.zip"
            marketing_version="$plist_version"
          elif [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]]; then
            short_sha="${GITHUB_SHA::8}"
            build_date="$(date -u +%Y%m%d)"
            version="nightly-${build_date}-${short_sha}"
            release_tag="$version"
            cask_token="flash@nightly"
            asset_name="Flash-${version}.zip"
            marketing_version=""
            prerelease="true"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
            release_tag="$GITHUB_REF_NAME"
            cask_token="flash"
            asset_name="Flash-${version}.zip"
            marketing_version="$GITHUB_REF_NAME"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "deploy=true"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "cask_token=$cask_token"
            echo "asset_name=$asset_name"
            echo "marketing_version=$marketing_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.11

      # Developer ID signing and notarization are opt-in through repository
      # secrets (docs/release.md names them). Without them the build is
      # ad-hoc signed, as before, and says so in the log.
      - name: Import the Developer ID certificate
        if: steps.meta.outputs.deploy == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::warning::MACOS_CERTIFICATE_P12 is not set: this build is ad-hoc signed and not notarized (see docs/release.md)"
            exit 0
          fi
          keychain="$RUNNER_TEMP/flash-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$certificate"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The certificate holds no 'Developer ID Application' identity"
            exit 1
          fi
          echo "Signing as: $identity"
          {
            echo "FLASH_SIGN_IDENTITY=$identity"
            echo "FLASH_HARDENED_RUNTIME=1"
            echo "FLASH_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Prepare the notarization key
        if: steps.meta.outputs.deploy == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [[ -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" || -z "$NOTARY_KEY_P8" ]]; then
            echo "::warning::NOTARY_KEY_ID, NOTARY_ISSUER_ID and NOTARY_KEY_P8 are not all set: skipping notarization (see docs/release.md)"
            exit 0
          fi
          if [[ -z "${FLASH_SIGN_IDENTITY:-}" ]]; then
            echo "Notarization needs the Developer ID certificate as well"
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key_path"
          {
            echo "FLASH_NOTARIZE=1"
            echo "FLASH_NOTARY_KEY_PATH=$key_path"
            echo "FLASH_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "FLASH_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Package Flash.app
        id: package
        if: steps.meta.outputs.deploy == 'true'
        run: |
          zip_path="$RUNNER_TEMP/${{ steps.meta.outputs.asset_name }}"
          if [[ -n "${{ steps.meta.outputs.marketing_version }}" ]]; then
            export FLASH_MARKETING_VERSION="${{ steps.meta.outputs.marketing_version }}"
          fi
          export FLASH_BUNDLE_VERSION="${{ github.run_number }}"
          export FLASH_ZIP_PATH="$zip_path"
          bash Scripts/build.sh --release
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "$zip_path.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release asset
        if: steps.meta.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash Scripts/publish-github-release.sh \
            "${{ steps.meta.outputs.release_tag }}" \
            "${{ steps.package.outputs.zip_path }}" \
            "${{ steps.meta.outputs.asset_name }}" \
            "Flash ${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.prerelease }}" \
            "$GITHUB_SHA"

      - name: Check Homebrew tap token
        if: steps.meta.outputs.deploy == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret is required to push aymericbeaumet/homebrew-tap"
            exit 1
          fi

      - name: Checkout Homebrew tap
        if: steps.meta.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          repository: aymericbeaumet/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew cask
        if: steps.meta.outputs.deploy == 'true'
        run: |
          url="https://github.com/aymericbeaumet/flash/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.asset_name }}"
          bash Scripts/update-homebrew-cask.sh \
            --tap-dir homebrew-tap \
            --token "${{ steps.meta.outputs.cask_token }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --url "$url" \
            --sha256 "${{ steps.package.outputs.sha256 }}"
          ruby -c "homebrew-tap/Casks/${{ steps.meta.outputs.cask_token }}.rb"

      - name: Push Homebrew tap update
        if: steps.meta.outputs.deploy == 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${{ steps.meta.outputs.cask_token }}.rb"
          if git diff --cached --quiet; then
            echo "No Homebrew tap changes"
            exit 0
          fi
          git commit -m "Update flash ${{ steps.meta.outputs.version }}"
          git push

      - name: Remove the signing keychain
        if: always() && env.FLASH_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$FLASH_SIGNING_KEYCHAIN"
