name: CI

on:
  push:
    # plugin-system-v2 rides CI while the branch is active (no PR yet);
    # drop it from this list at merge.
    branches: [main, plugin-system-v2]
    tags:
      - "*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show swift-format version
        run: swift format --version
      - name: Check formatting
        # Run the formatter in-place, then require a clean working tree.
        # No `.swift-format` config in the repo — Apple's default rules
        # are the source of truth.
        run: |
          swift format format --in-place --recursive Sources Tests Package.swift
          git diff --exit-code

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show swift-format version
        run: swift format --version
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

  guardrails:
    name: Guardrails
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check hard-rule guardrails
        run: ./Scripts/check-guardrails.sh

  plugins:
    name: Plugins (cargo)
    runs-on: macos-15
    env:
      # Shared across every hermetic crate: cargo keys artifacts by
      # package-id + metadata hash, so the SDK compiles once, not 32 times.
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/plugin-target
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry + shared plugin target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/plugin-target
          key: ${{ runner.os }}-plugin-cargo-${{ hashFiles('Plugins/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-plugin-cargo-
      - name: fmt + clippy + build + test per hermetic crate
        # One fail-fast loop over the SDK workspace and the 32 standalone
        # plugin crates. `cd` (not --manifest-path) is load-bearing: clippy
        # discovers each crate's clippy.toml by walking up from the cwd.
        # `--locked` doubles as the committed-Cargo.lock freshness gate, and
        # `-D warnings` keeps clippy a hard gate so warnings can't accumulate.
        run: |
          set -euo pipefail
          for dir in Plugins/_flash_plugin_rust Plugins/[!_]*/; do
            [[ -f "$dir/Cargo.toml" ]] || continue
            echo "== $dir"
            (cd "$dir" &&
              cargo fmt --all --check &&
              cargo clippy --workspace --all-targets --locked -- -D warnings &&
              cargo build --workspace --release --locked &&
              cargo test --workspace --locked)
          done

  conformance:
    name: Plugins (conformance)
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/plugin-target
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry + plugin target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/plugin-target
          key: ${{ runner.os }}-plugin-cargo-${{ hashFiles('Plugins/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-plugin-cargo-
      - name: Cache SwiftPM build (sandbox-profile verb)
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-
      - name: Full plugin pipeline
        # Scripts/test-plugins.sh runs everything: spec-schema validation,
        # Rust lint, per-crate cargo unit tests, dev builds of all executable
        # plugins + the Rust conformance probe,
        # then the conformance matrix — every bundled plugin × every
        # applicable spec, the Rust probe × the full suite, and the sandbox
        # lane booting each sandboxed plugin under its REAL generated
        # seatbelt profile. Coverage is by manifest glob: a new plugin or
        # spec is exercised by construction, never by editing this file.
        # TCC-dependent skips live in Plugins/_flash_plugin_specs/
        # overrides.json (reminders, shortcuts — the first suspects if this
        # job reds on a runner TCC change); an xfail that PASSES fails the
        # run, so parity debt can only shrink.
        run: ./Scripts/test-plugins.sh --lane all --jobs 8 --report conformance-report.json --github-annotations
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-build-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-
      - name: Build
        run: swift build

  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-test-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-test-
      - name: Cache Cargo registry + plugin target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/plugin-target
          key: ${{ runner.os }}-plugin-cargo-${{ hashFiles('Plugins/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-plugin-cargo-
      - name: Build smoke-test plugin binaries
        # The two end-to-end subprocess smoke tests XCTSkip without these
        # binaries — building them turns silent skips into real runs. Doctor
        # also inspects media as a representative bundled plugin.
        run: ./Scripts/build-plugins.sh dev slack spotify calculator media
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/plugin-target
      - name: Test
        run: swift test

  inspector:
    name: Inspector
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Inspector/pnpm-lock.yaml
      - name: Install inspector deps
        working-directory: Inspector
        run: pnpm install --frozen-lockfile
      - name: Build inspector bundle
        working-directory: Inspector
        run: pnpm build
      - name: Stage bundle as SwiftPM resource
        run: cp Inspector/dist/index.html Sources/flash/Resources/inspector.html
      - name: Require committed bundle to be up to date
        # The committed resource must match a fresh build of Inspector/.
        # If this fails, run Scripts/build-inspector.sh and commit the result.
        run: git diff --exit-code Sources/flash/Resources/inspector.html

  homebrew:
    name: Homebrew
    runs-on: macos-15
    # plugins + conformance are REQUIRED: a red plugin build or a failed
    # conformance matrix must never ship a release.
    needs: [format, lint, guardrails, build, test, inspector, plugins, conformance]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure deployment
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]]; then
            short_sha="${GITHUB_SHA::8}"
            build_date="$(date -u +%Y%m%d)"
            version="nightly-${build_date}-${short_sha}"
            release_tag="nightly"
            cask_token="flash@nightly"
            asset_name="Flash-${version}.zip"
            marketing_version=""
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
            release_tag="$GITHUB_REF_NAME"
            cask_token="flash@$GITHUB_REF_NAME"
            asset_name="Flash-${version}.zip"
            marketing_version="$GITHUB_REF_NAME"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "cask_token=$cask_token" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Package Flash.app
        id: package
        if: steps.meta.outputs.deploy == 'true'
        run: |
          zip_path="$RUNNER_TEMP/${{ steps.meta.outputs.asset_name }}"
          if [[ -n "${{ steps.meta.outputs.marketing_version }}" ]]; then
            export FLASH_MARKETING_VERSION="${{ steps.meta.outputs.marketing_version }}"
          fi
          export FLASH_BUNDLE_VERSION="${{ github.run_number }}"
          export FLASH_ZIP_PATH="$zip_path"
          bash Scripts/build.sh --release
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "$zip_path.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release asset
        if: steps.meta.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ steps.meta.outputs.release_tag }}"
          title="Flash ${{ steps.meta.outputs.version }}"
          notes="Automated build from ${GITHUB_SHA}."
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            args=(release create "$release_tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes")
            if [[ "$release_tag" == "nightly" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          gh release upload \
            "$release_tag" \
            "${{ steps.package.outputs.zip_path }}#${{ steps.meta.outputs.asset_name }}" \
            --clobber

      - name: Check Homebrew tap token
        if: steps.meta.outputs.deploy == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret is required to push aymericbeaumet/homebrew-tap"
            exit 1
          fi

      - name: Checkout Homebrew tap
        if: steps.meta.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          repository: aymericbeaumet/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew cask
        if: steps.meta.outputs.deploy == 'true'
        run: |
          url="https://github.com/aymericbeaumet/flash/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.asset_name }}"
          bash Scripts/update-homebrew-cask.sh \
            --tap-dir homebrew-tap \
            --token "${{ steps.meta.outputs.cask_token }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --url "$url" \
            --sha256 "${{ steps.package.outputs.sha256 }}"
          ruby -c "homebrew-tap/Casks/${{ steps.meta.outputs.cask_token }}.rb"

      - name: Push Homebrew tap update
        if: steps.meta.outputs.deploy == 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${{ steps.meta.outputs.cask_token }}.rb"
          if git diff --cached --quiet; then
            echo "No Homebrew tap changes"
            exit 0
          fi
          git commit -m "Update flash ${{ steps.meta.outputs.version }}"
          git push
