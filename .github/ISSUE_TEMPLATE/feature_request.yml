name: Feature request
description: A mapping, action, plugin or bar feature you miss.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, in the app where you do it today.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it now
      description: A mouse gesture, another tool, a Hammerspoon snippet.
  - type: textarea
    id: shape
    attributes:
      label: How it could look in flash.toml
      render: toml
