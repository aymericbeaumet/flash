name: Bug report
description: Hints missing or wrong, a key not working, a crash.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what Flash did instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and version where it happened
      placeholder: Firefox 142, Finder, Slack 4.40
  - type: textarea
    id: doctor
    attributes:
      label: Output of `flash doctor` and `flash status`
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant part of `~/.config/flash/flash.toml`
      render: toml
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshot
      description: >
        Lines from `~/Library/Logs/Flash/flash.log`, or a screenshot with
        `[debug] show_hints_bounds = true` for missing or misplaced hints.
