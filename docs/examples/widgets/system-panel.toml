# A conky-style system panel: CPU, memory and disk meters with sparklines,
# disk and network rates, uptime, load and the busiest processes. Every figure
# comes from the bundled sysinfo plugin or Flash's own process tables; the
# panel runs no command.
# See README.md in this directory to add it to flash.toml.
#
# Each gauge row is a label, a 16-cell meter, the figure and a sparkline on a
# fixed 0-100 scale; each rate row is the rate in kB/s and a sparkline scaled
# to its own peak. Write %% for a percent sign, and %%%% inside a #{?...}
# branch, which is expanded once more. Each process table shows
# `[statusbar] top_count` rows (1-20, default 5).

[widgets.system]
anchor = "top_right"
columns = 48
bg = "#2E3440CC"
border = "#4C566A"
border_size = 1
template = """
#[fg=#EBCB8B bold]#{host_short}#[default]\
#[align=right fg=#81A1C1]up #{flash.plugin.sysinfo.cpu_uptime}  load #{flash.plugin.sysinfo.cpu_load}
#[fg=#4C566A]#{R:─,#{flash.widget.columns}}#[default]
#[fg=#88C0D0]CPU#[default] \
#[meter=16 fg=#A3BE8C bg=#3B4252]#{flash.plugin.sysinfo.cpu_percent}#[nometer default] \
#{p-3:flash.plugin.sysinfo.cpu_percent}%% \
#[fg=#81A1C1 spark=0/100]#{flash.plugin.sysinfo.cpu_history}#[nospark default]
#[fg=#88C0D0]MEM#[default] \
#[meter=16 fg=#A3BE8C bg=#3B4252]#{flash.plugin.sysinfo.memory_percent}#[nometer default] \
#{p-3:flash.plugin.sysinfo.memory_percent}%% \
#[fg=#81A1C1 spark=0/100]#{flash.plugin.sysinfo.memory_history}#[nospark default]
#[fg=#88C0D0]DSK#[default] \
#[meter=16 fg=#A3BE8C bg=#3B4252]#{flash.plugin.sysinfo.disks_percent}#[nometer default] \
#{p-3:flash.plugin.sysinfo.disks_percent}%%
#{?flash.plugin.sysinfo.power_percent,#[fg=#88C0D0]BAT#[default] \
#[meter=16 fg=#A3BE8C bg=#3B4252]#{flash.plugin.sysinfo.power_percent}#[nometer default] \
#{p-3:flash.plugin.sysinfo.power_percent}%%%% #{flash.plugin.sysinfo.power_state},#[fg=#4C566A]BAT none}
#[fg=#88C0D0]I/O#[default] R #{flash.plugin.sysinfo.disks_read}  W #{flash.plugin.sysinfo.disks_write}
#[fg=#88C0D0]NET#[default] ↓ #{p-7:#{e|/|f|1:#{flash.plugin.sysinfo.network_down_bps},1000}} kB/s \
#[fg=#81A1C1 spark]#{flash.plugin.sysinfo.network_down_history}#[nospark default]
#[fg=#88C0D0]   #[default] ↑ #{p-7:#{e|/|f|1:#{flash.plugin.sysinfo.network_up_bps},1000}} kB/s \
#[fg=#81A1C1 spark]#{flash.plugin.sysinfo.network_up_history}#[nospark default]
#[fg=#88C0D0]IP #[default] #{flash.plugin.sysinfo.network_address}
#[fg=#4C566A]#{R:─,#{flash.widget.columns}}#[default]
#[fg=#88C0D0]TOP CPU#[default]
#{flash.top_cpu}
#[fg=#88C0D0]TOP MEM#[default]
#{flash.top_mem}
"""
