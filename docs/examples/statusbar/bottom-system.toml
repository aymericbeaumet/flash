# Shared SYS dashboard, sized for a 100-column by 28-row terminal.
[flags]
rate = "2s"
read_only = true
retention = "10m"
table_gap = "none"

[styles]
theme = "nord"

[cpu]
default = "average"

[processes]
columns = ["PID", "Name", "CPU%", "Mem%", "R/s", "W/s"]
default_sort = "CPU%"
default_memory_value = true

[disk]
columns = ["Mount", "Used%", "Free", "R/s", "W/s"]

[disk.mount_filter]
is_list_ignored = true
list = ["^/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware)$", "^/Library/Developer/CoreSimulator/"]
regex = true

[network_graph]
use_bytes = true

[[row]]
ratio = 6
[[row.child]]
type = "cpu"

[[row]]
ratio = 9
[[row.child]]
type = "mem"
[[row.child]]
type = "net"

[[row]]
ratio = 5
[[row.child]]
type = "disk"

[[row]]
ratio = 8
[[row.child]]
type = "proc"
default = true
