# Editors with a TOML language server (Taplo, Even Better TOML) validate and
# complete Flash's TOML files against the schema the loader is built from
# (docs/schema/flash.schema.json, regenerated by `mise run build:schema`).
[[rule]]
include = ["config.default.toml", "docs/examples/**/*.toml"]

[rule.schema]
path = "docs/schema/flash.schema.json"
