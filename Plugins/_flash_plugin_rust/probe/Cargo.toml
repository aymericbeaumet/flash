[package]
name = "flash_plugin_probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wire probe: a generic plugin!-generated plugin the SDK's cargo tests drive over the protocol. Never shipped or spawned by the host."

[dependencies]
flash_plugin = { path = ".." }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros"] }
