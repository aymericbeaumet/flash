[package]
name = "flash_plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tokio NDJSON-over-stdio scaffolding for Flash plugins (macOS)."

# Self-contained SDK workspace (flash_plugin, its proc-macro crate, and the
# wire probe that exercises the generated plugin surface from cargo test)
# with its own committed Cargo.lock. This is the ONLY workspace under
# Plugins/ — every plugin is a hermetic standalone crate that path-depends on
# this package. The probe lives below the SDK so no Plugins/*/manifest.json
# glob (build-plugins.sh, check-guardrails.sh, the host's discovery) ever
# treats it as a bundled plugin.
[workspace]
members = ["macros", "probe"]

[dependencies]
flash_plugin_macros = { path = "macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "macros",
  "io-std",
  "io-util",
  "fs",
  "process",
  "time",
  "sync",
] }
