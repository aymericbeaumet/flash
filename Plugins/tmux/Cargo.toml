[package]
name = "flash-plugin-tmux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "flash-plugin-tmux"
path = "src/main.rs"

[dependencies]
flash-plugin = { path = "../../flash_plugin_template" }
serde_json = "1"
regex = "1"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "process",
  "time",
  "sync",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSFont",
  "objc2-core-foundation",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
