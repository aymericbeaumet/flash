[package]
name = "flash-plugin-searchproviders"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "flash-plugin-searchproviders"
path = "src/main.rs"

[dependencies]
flash_plugin = { path = "../_flash_plugin_rust" }
# Kagi's three query-pattern bangs (`x`): ASCII classes and captures only.
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Mozilla roots for rustls: the sandbox denies the macOS trust service and
# keychains that reqwest's default platform verifier needs.
webpki-root-certs = "1.0.12"
# The SDK feature set plus `net`: reqwest needs tokio's TCP driver.
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "macros",
  "io-std",
  "io-util",
  "fs",
  "process",
  "time",
  "sync",
  "net",
] }

# Dev hot-loop profile used by Scripts/build-plugins.sh: mild optimization
# (fully-unoptimized tokio is visibly slow under the plugin latency contracts),
# line-tables-only debuginfo keeps the shared target dir small.
[profile.plugin-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

# Long-lived resident child process: optimize for size and cold start.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
