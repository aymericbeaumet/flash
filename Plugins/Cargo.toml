[workspace]
resolver = "2"
members = [
  "_rust_flash_plugin",
  "_rust_flash_plugin_macros",
  "aiproviders",
  "calculator",
  "chromium",
  "clipboard",
  "contacts",
  "defaults",
  "emojis",
  "firefox",
  "marks",
  "media",
  "notes",
  "processes",
  "reminders",
  "safari",
  "searchengines",
  "slack",
  "spotify",
  "system",
  "tmux",
  "gmail",
]

# Shared dependency versions. Each plugin opts in via
# `serde = { workspace = true, ... }` so all crates resolve to identical
# transitive versions and the single workspace `Cargo.lock` is the only
# source of truth. Plugin-specific deps (e.g. `fasteval2`) stay inline in
# the plugin's own Cargo.toml.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
regex = "1"
proc-macro2 = "1"
quote = "1"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "process",
  "time",
  "sync",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }

# Plugin binaries optimize for size — the resident host loads each as a
# long-lived child process, so faster cold start and lower memory beats a
# few hundred ms of extra build time. Profiles are workspace-global; the
# per-crate Cargo.tomls no longer carry their own [profile.release].
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
