[package]
name = "flash-plugin-processes"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "flash-plugin-processes"
path = "src/main.rs"

[dependencies]
flash_plugin = { path = "../_flash_plugin_rust" }
# The memory size (`sysctl hw.memsize`), behind `src/sys.rs`.
libc = "0.2.191"
# `rt` to sample off the event worker; `macros` for the async tests.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }

[dev-dependencies]
serde_json = "1.0.154"

# Dev hot-loop profile used by Scripts/build-plugins.sh: mild optimization
# (fully-unoptimized tokio is visibly slow under the plugin latency contracts),
# line-tables-only debuginfo keeps the shared target dir small.
[profile.plugin-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

# Long-lived resident child process: optimize for size and cold start.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
