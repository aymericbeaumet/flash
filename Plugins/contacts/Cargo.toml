[package]
name = "flash-plugin-contacts"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "flash-plugin-contacts"
path = "src/main.rs"

[dependencies]
flash-plugin = { path = "../_flash_plugin_rust" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "process",
  "time",
  "sync",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
