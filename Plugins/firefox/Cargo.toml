[package]
name = "flash-plugin-firefox"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "flash-plugin-firefox"
path = "src/main.rs"

# Firefox's native-messaging host for the bundled tab-bridge add-on. FIREFOX
# spawns this one, per message, with Mozilla's 4-byte length framing — it is
# not a Flash plugin, never appears in a manifest `exec`, and the repository
# scanner cannot reach it (it looks exactly one level below Plugins/ for a
# manifest.json).
[[bin]]
name = "flash-plugin-firefox-bridge"
path = "src/bridge.rs"

[dependencies]
flash_plugin = { path = "../_flash_plugin_rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "macros",
  "io-std",
  "io-util",
  "fs",
  "process",
  "time",
  "sync",
] }

# Dev hot-loop profile used by Scripts/build-plugins.sh: mild optimization
# (fully-unoptimized tokio is visibly slow under the plugin latency contracts),
# line-tables-only debuginfo keeps the shared target dir small.
[profile.plugin-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

# Long-lived resident child process: optimize for size and cold start.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
