[package]
name = "flash-plugin-feed"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "flash-plugin-feed"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flash_plugin = { path = "../_flash_plugin_rust" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
roxmltree = "0.21.2"
scraper = { version = "0.29.0", default-features = false }
serde_json = "1.0.154"
# Mozilla roots for rustls: the sandbox denies the macOS trust service and
# keychains that reqwest's default platform verifier needs.
webpki-root-certs = "1.0.12"
# The SDK feature set plus `net`: reqwest needs tokio's TCP driver.
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "macros",
  "io-std",
  "io-util",
  "fs",
  "process",
  "time",
  "sync",
  "net",
] }

[profile.plugin-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
