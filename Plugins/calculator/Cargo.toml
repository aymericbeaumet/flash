[package]
name = "flash-plugin-calculator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "flash-plugin-calculator"
path = "src/main.rs"

[dependencies]
flash-plugin = { path = "../_flash_plugin_rust" }
meval = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
