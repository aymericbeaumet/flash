# Flash default configuration.
#
# This file is the canonical reference for the user-facing configuration
# sections Flash accepts. Copy the keys you want to edit into:
#
#   $XDG_CONFIG_HOME/flash/flash.toml
#   ~/.config/flash/flash.toml
#
# The active file is watched for live reload.

[hints]
# Alphabet used to generate prefix-free hint labels.
# Either a layout selector token or a literal string of ASCII letters.
# Layout selector syntax: <$layout[_$row][_$hand]+...>
#   layouts: qwerty, colemak, dvorak
#   rows: homerow, toprow, bottomrow
#   hands: lefthand, righthand
keys = "<qwerty_homerow+qwerty_toprow>"

# Floor on label length. Force longer labels by raising this.
min_length = 1

# Modifiers that can be held on the final hint key and forwarded to the click.
# Supported names: "cmd", "ctrl", "alt", "shift".
magic_modifiers = ["cmd", "ctrl", "alt", "shift"]

# Selection steps for the `mouse_grid` verb. The grid is always a square
# NxN with N the largest odd integer such that N*N <= alphabet length
# (so a 25-letter alphabet lands on 5x5). Each selection zooms into a
# cell and re-tiles it with the same grid. Larger step counts give
# finer precision at the cost of more keystrokes. Valid range: 2–6.
mouse_grid_steps = 3

# Opacity (0.0..1.0) applied to every mouse-grid chip. 1.0 = fully
# opaque, 0.0 = invisible. The grid fills the screen during a precision
# click, so a slight translucency keeps the underlying app visible.
mouse_grid_opacity = 0.5

[open]
# App candidates hidden from :open and the `app_open name=...` verb.
# Entries match display name, bundle identifier, bundle path, .app filename,
# or app filename without .app, case-insensitively.
ignored_apps = []

[plugins]
# Official bundled plugins are enabled unless listed in `disabled`.
# Disable `defaults` for a raw host-only experience without built-in
# plugin-layer defaults such as app_save/app_print/document_open/window_new.
disabled = []

# Third-party plugins are loaded only when listed here.
# Supported references:
#   github:user/project@<40-char commit sha>
#   file:<path>
# GitHub references must pin a full 40-char commit SHA — branches and tags are
# rejected because third-party install/start scripts run as the user, and a
# moving ref would let a compromised plugin author land arbitrary code on each
# config reload.
third_party = []

# When true (the default), each plugin's directory tree is watched and a
# file change triggers a plugin reload. Set to false to disable
# hot-reload across every plugin.
watching_enabled = true

[statusbar]
# Show the persistent top status bar. This switch alone controls the bar's
# visibility — it is independent of advanced mode (the enter_normal_mode
# binding). Defaults to false.
enabled = false
# Which displays show the bar: "all" (default, every screen's top band) or
# "primary" (only the main / menu-bar display).
monitor = "all"
# Single template string for the status bar. Use tmux-style alignment
# markers to switch which region subsequent content lands in:
#
#   #[align=left]    — highlighted left cell (default until a marker fires)
#   #[align=centre]  — centred section between left and right
#   #[align=right]   — right-aligned section
#
# Inline styling markers stay in whatever region the parser is currently
# filling and pass through to the renderer:
#
#   #[fg=colour245]       — foreground colour (numbered tmux palette)
#   #[bg=colour0]         — background colour
#   #[bold] / #[nobold]   — bold weight on/off
#   #[italics] / #[noitalics]
#   #[underscore] / #[nounderscore]
#   #[dim] / #[nodim]
#   #[reverse] / #[noreverse]
#   #[blink] / #[noblink]            — pulse the wrapped text once a
#                                     second (tmux's blink attribute).
#   #[breathing] / #[nobreathing]    — Flash extension. Subtle opacity
#                                     sinusoid on a 10-second cycle
#                                     (80 → 100 % alpha) — well below a
#                                     baseline meditation breath so the
#                                     chip never signals, just sits alive.
#                                     Used by the system plugin to mark
#                                     a battery that's plugged in.
#
# `##` emits a literal `#`. Wrap a token in `#{=N:…}` (or `#{=-N:…}` for
# trailing window) to cap its rendered length at N characters — useful
# when an app name or plugin field could overflow the bar.
#
# Supported template variables (#{token}):
#   #{mode}
#   #{active_app_name}
#   #{active_bundle_identifier}
#   #{date}
#   #{host} / #{hostname} / #H
#   #{host_short} / #h
#   #{user}
#   #{uid}
#   #{pid}
#   any other tmux status variable       # accepted, renders as empty when Flash has no equivalent
#   #{plugin:loaded_count}
#   #{plugin:ready_count}
#   #{plugin:error_count}
#   #{plugin:<plugin>.<segment>}     # e.g. #{plugin:system.battery}
#   #{script:<path>}
#   #{command:<shell command>}
#
# A triple-quoted multi-line string lets long templates breathe across
# rows. Newlines in the template are ignored before rendering.
# Flash re-renders when mode, focused app, plugin status, or the minute
# clock changes. Command/script sections are polled only when the
# template contains them and keep their previous successful value until
# a replacement is ready.
template = "#[align=left]#{mode}#[align=right]#{date}"
# Example with a custom right-side composition:
# template = """
#   #[align=left]#{mode}
#   #[align=center]#{active_app_name}
#   #[align=right]#{plugin:system.battery}
#   #[fg=colour245] · #{date}
#   """

[flashlight]
# Number of suggestion rows shown below the command bar.
suggestion_count = 10
# The default flashlight pool is intentionally location-only: apps, tabs,
# tmux windows, and any plugin-provided location entities.
# Other sources are hidden unless the query includes an explicit @source filter.
# Bonus added to candidates backed by a running process, used as a tiebreaker
# inside the same source.
precedence_alive_bonus = 10

[flashlight.aliases]
# Literal token substitutions applied when the token is followed by
# whitespace. Any leading sigil is part of the key.
# "!g" = "!google"
# "@ft" = "@firefox.tabs"

[flashlight.precedence]
# Optional source-order overrides used as tie-breakers for location rows or
# explicit @source result sets. Keys are source labels or parent prefixes.
# Example:
# tmux = 200
# "firefox.tabs" = 120

[mode]
# Mode labels shown after the active app name in the persistent status bar
# when advanced mode is enabled.
labels = { normal = "NORMAL", insert = "INSERT", command = "COMMAND" }

# Time (in ms) the interpreter waits for the next key in a pending
# sequence before resolving the longest matching prefix. Equivalent to
# Vim's `timeoutlen`. Lower = faster commit but more two-key collisions;
# higher = slower commit but fewer surprises. Matches Neovim's
# `timeoutlen` default of 1000.
sequence_timeout_ms = 1000

[mode.all.mappings]
# Modified-key mappings available in every mode, including command-line and
# candidate-finder surfaces. Non-modified keys are read only while Flash owns
# normal-mode input, as described below.
# Every value is an argv array. Arrays starting with "flash" or a path whose
# basename is "flash" dispatch the verb in-process; any other head is launched
# as argv (no shell wrap) with `~` and env expansion on each element. Bare
# strings and URLs are rejected.
# Relative argv paths containing "/" are resolved from this config file.
#
# Native modified-key mappings are registered with Carbon only when the key
# contains "+". Non-modified keys are read only by the overlay while Flash is
# capturing normal-mode input.
#
# Examples:
# "ctrl+space" = ["flash", "mouse_target"]
# "ctrl+alt+n" = ["flash", "enter_normal_mode"] # enables advanced mode
# "cmd+ctrl+a" = ["flash", "app_open", "--name=Alacritty"]
# "alt+h" = ["flash", "window_move", "--position=lefthalf"]
# "alt+n" = ["flash", "window_move", "--screen=+1"]
# "alt+shift+c" = ["sh", "~/bin/toggle-colors"]
# The `enter_command_mode` verb opens the command-line panel pre-seeded with
# `--input='<text>'`. Leading colons are stripped and exactly one `:` is
# prepended for the visible prefix; the rest is passed through verbatim,
# so trailing spaces are meaningful — `--input=:flashlight ` opens the
# verb with an empty query while `--input=:flashlight` lists completions
# for verbs starting with `flashlight`. `--restore-mode` restores whichever
# mode was active when the mapping fired. An emoji picker you can trigger
# from INSERT and resume typing afterward:
# "cmd+ctrl+space" = ["flash", "enter_command_mode", "--input=:flashlight @emojis.glyphs ", "--restore-mode"]

[mode.normal]
# Let an unmapped shortcut carrying any listed modifier switch Flash to INSERT
# and continue to the focused app or macOS unchanged. Explicit normal/all
# mappings still win. Use [] to keep NORMAL hermetic.
passthrough_modifiers = ["cmd", "ctrl", "shift", "alt"]
# Normal-mode sequence prefix. Use it in normal mappings as <leader>.
leader = "\\"

[mode.normal.mappings]
# Entries here extend the built-in normal-mode map. Reusing a key overrides
# that one default mapping; unrelated defaults stay available.
# Mapped keys dispatch Flash commands and bare unmapped keys are swallowed.
# With `passthrough_modifiers`, matching unmapped shortcuts instead switch to
# INSERT and continue natively.
# Use an inline table when a mapping needs metadata. `repeat = true` lets each
# additional press of the final key repeat the completed sequence (`[tttt`).
# Every built-in [ / ] sequence below enables it.
# Example:
# "<leader>c" = ["../../scripts/toggle_caffeinate.sh"]
"h" = ["flash", "scroll_left"]
"j" = ["flash", "send_key", "--keys=down"]
"k" = ["flash", "send_key", "--keys=up"]
"l" = ["flash", "scroll_right"]
"ctrl-e" = ["flash", "scroll_down"]
"ctrl-y" = ["flash", "scroll_up"]
"ctrl-d" = ["flash", "scroll_half_page_down"]
"ctrl-u" = ["flash", "scroll_half_page_up"]
# Vimium parity: bare d/u scroll a half page (ctrl-d/ctrl-u stay as
# vim-style aliases). d is kept free of any hint-mode prefix — double-click
# hints live on the D prefix below — so the bare keystroke fires instantly.
"d" = ["flash", "scroll_half_page_down"]
"u" = ["flash", "scroll_half_page_up"]
"gg" = ["flash", "scroll_top"]
"G" = ["flash", "scroll_bottom"]
# Vimium H/L — back/forward in history. (Lowercase h/l scroll left/right.)
# [h/]h alias these, unimpaired-style.
"H" = ["flash", "history_back"]
"L" = ["flash", "history_forward"]
"[h" = { action = ["flash", "history_back"], repeat = true }
"]h" = { action = ["flash", "history_forward"], repeat = true }
"[t" = { action = ["flash", "tab_previous"], repeat = true }
"]t" = { action = ["flash", "tab_next"], repeat = true }
# Vim buffer aliases map naturally onto desktop tabs.
"[b" = { action = ["flash", "tab_previous"], repeat = true }
"]b" = { action = ["flash", "tab_next"], repeat = true }
"[B" = { action = ["flash", "tab_first"], repeat = true }
"]B" = { action = ["flash", "tab_last"], repeat = true }
# Vimium J/K — one tab left (previous) / right (next), capital siblings
# of gT/gt.
"J" = ["flash", "tab_previous"]
"K" = ["flash", "tab_next"]
# Vimium ]]/[[ — follow the next/previous resource (pagination links).
"]]" = { action = ["flash", "resource_next"], repeat = true }
"[[" = { action = ["flash", "resource_previous"], repeat = true }
# Reorder the current tab. In tmux this swap-windows; in browsers there
# is no portable equivalent so the mapping is a no-op.
"[m" = { action = ["flash", "tab_move_previous"], repeat = true }
"]m" = { action = ["flash", "tab_move_next"], repeat = true }
"[e" = { action = ["flash", "tab_move_previous"], repeat = true }
"]e" = { action = ["flash", "tab_move_next"], repeat = true }
"[a" = { action = ["flash", "app_previous"], repeat = true }
"]a" = { action = ["flash", "app_next"], repeat = true }
# Cycle the focused app's windows with native macOS shortcuts.
"[w" = { action = ["flash", "send_key", "--keys=cmd+shift+`"], repeat = true }
"]w" = { action = ["flash", "send_key", "--keys=cmd+`"], repeat = true }
# Restore the most recently closed tab. Vimium binds this to X; browsers
# receive ⌘⇧T; tmux has no closed-window history so it returns "unhandled".
"X" = ["flash", "tab_reopen"]
# Vimium T searches open tabs — Flash opens the flashlight switcher
# (its default pool is location-only: apps, tabs, tmux windows, …).
"T" = ["flash", "enter_command_mode", "--input=:flashlight "]
# cmd+tab / cmd+shift+tab shadow the system app switcher while in normal
# mode. Carbon hotkeys are scope-bound, so entering insert mode releases
# the registration and macOS's Dock switcher takes over again.
"cmd+tab" = ["flash", "app_next"]
"cmd+shift+tab" = ["flash", "app_previous"]
# Native terminal navigation chords deliberately stay unregistered: terminal
# apps can route them directly to tmux without a Flash round trip, while
# Flash's g1–g9, [t/]t, [h/]h, t, and x mappings remain available in normal
# mode and keep working across every discovered terminal.
"cmd+r" = ["flash", "app_reload"]                  # ≈ r
"cmd+shift+r" = ["flash", "app_reload", "--force"] # ≈ R
# The bundled tmux source registers no mappings; terminals can send their
# native tmux prefix bindings directly for zero-round-trip pane/window actions.
"cmd+shift+t" = ["flash", "tab_reopen"]            # ≈ T
"cmd+n" = ["flash", "window_new"]                  # ≈ n
"cmd+f" = ["flash", "app_find"]                    # ≈ /
"ctrl+tab" = ["flash", "tab_next"]                 # browser-native ≈ ]t
"ctrl+shift+tab" = ["flash", "tab_previous"]       # browser-native ≈ [t
"g^" = ["flash", "tab_first"]
"g$" = ["flash", "tab_last"]
"g0" = ["flash", "tab_first"] # Vimium: first tab (alias of g^)
"g1" = ["flash", "tab_select", "--index=1"]
"g2" = ["flash", "tab_select", "--index=2"]
"g3" = ["flash", "tab_select", "--index=3"]
"g4" = ["flash", "tab_select", "--index=4"]
"g5" = ["flash", "tab_select", "--index=5"]
"g6" = ["flash", "tab_select", "--index=6"]
"g7" = ["flash", "tab_select", "--index=7"]
"g8" = ["flash", "tab_select", "--index=8"]
"g9" = ["flash", "tab_select", "--index=9"]
"ctrl-o" = ["flash", "movement_back"]
"ctrl-i" = ["flash", "movement_forward"]
"a" = ["flash", "enter_insert_mode"]
"A" = ["flash", "enter_insert_mode"]
"i" = ["flash", "enter_insert_mode"]
"I" = ["flash", "enter_locked_insert_mode"]
"o" = ["flash", "enter_insert_mode"]
"O" = ["flash", "enter_insert_mode"]
# Vimium-style target opening: Shift-F presets a Command-Shift-click so links
# open in a focused new tab. Holding a configured hints.magic_modifiers key on
# the final hint character still adds that modifier to either action.
"f" = ["flash", "mouse_target"]
"F" = ["flash", "mouse_target", "--modifiers=cmd+shift"]
# Ctrl selects the precision grid; adding Shift preserves the current/new-tab
# pairing above by presetting the same Command-Shift-click on the final grid point.
"ctrl+f" = ["flash", "mouse_grid"]
"ctrl+shift+f" = ["flash", "mouse_grid", "--modifiers=cmd+shift"]
"sf" = ["flash", "mouse_target", "--secondary"]
# Double-click hints sit on the D ("Double") prefix, not d, so the bare
# d half-page scroll above stays instant.
"Df" = ["flash", "mouse_target", "--double"]
"mf" = ["flash", "mouse_target", "--move"]
"sF" = ["flash", "mouse_grid", "--secondary"]
"DF" = ["flash", "mouse_grid", "--double"]
"mF" = ["flash", "mouse_grid", "--move"]
# Undo is no longer on bare u (Vimium reuses it for half-page scroll-up);
# reach it via the command line (:undo) or the app's native ⌘Z.
"ctrl-r" = ["flash", "app_redo"]
# y yanks (copies) the current selection; p pastes it back. With no register
# these use the system clipboard, so they interoperate with copy/paste in every
# other app. A "<name> prefix routes through a register instead: "ay yanks into
# register a, "ap pastes from it (registers a-z, 0-9 survive clipboard churn; an
# uppercase name like "Ay appends; +, *, and " name the system clipboard). Bare
# y commits after the sequence timeout because it's a one-key prefix of yy.
"y" = ["flash", "yank_selection"]
"p" = ["flash", "paste"]
# yy yanks the current URL/location (Vimium yy).
"yy" = ["flash", "url_copy"]
"e" = ["flash", "resource_archive"]
# tmux-aware close: kills the current tmux window in the current session
# when an attached tmux client is focused, otherwise falls back to ⌘W.
"x" = ["flash", "tab_close"]
# Vimium n/N cycle find matches — Flash drives the focused app's native
# find-again (⌘G / ⌘⇧G) after `/` opens find. New windows stay on ⌘N.
"n" = ["flash", "send_key", "--keys=cmd+g"]
"N" = ["flash", "send_key", "--keys=cmd+shift+g"]
# Context-aware new: opens a new tmux window when a tmux client is focused
# or a new browser tab in browsers. Other apps do nothing.
"t" = ["flash", "tab_new"]
"/" = ["flash", "app_find"]
"<leader>space" = ["flash", "enter_command_mode", "--input=:flashlight "]
# Context-aware reload: browsers reload the current page; tmux refreshes
# the focused client. Other apps do nothing.
"r" = ["flash", "app_reload"]
"R" = ["flash", "app_reload", "--force"]
"?" = ["flash", "help_show"]
":" = ["flash", "enter_command_mode"]

[mode.insert.mappings]
# Mappings here apply only after insert mode is already active.
# Advanced mode is enabled only by binding ["flash", "enter_normal_mode"] in [mode.all.mappings].

[debug]
# Set to true to draw the raw detected rect for every target alongside its
# hint chip. Useful when diagnosing missing or misplaced hints.
show_hints_bounds = false

# Fill + stroke for the debug outline rectangle.
hints_bounds_bg = "#00000000"
hints_bounds_fg = "#FF3B9A"

# Accepted values: "trace", "debug", "info", "warn", "error", "fatal".
# Logs are newline-delimited JSON written to stderr and
# ~/Library/Logs/Flash/flash.log. Set "trace" to include AX tree dumps.
log_level = "info"

# Optional loopback-only dense debug page with live logs and Flash/plugin
# state. Set `http_inspector_enabled = true` to start the HTTP server; host is
# restricted to `localhost` / `127.0.0.1` / `::1`.
http_inspector_enabled = false
http_inspector_host = "localhost"
http_inspector_port = 4242
