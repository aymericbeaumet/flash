# Flash — default configuration.
#
# This file is the canonical reference for every configuration key Flash
# accepts, with its built-in default value. Copy any keys you want to
# override into one of these paths (first existing wins):
#
#   $XDG_CONFIG_HOME/flash/flash.toml
#   ~/.config/flash/flash.toml
#   ~/.flash.toml
#
# All three are watched for live reload — no restart needed.
#
# Every key below can ALSO be overridden via a command-line flag or an
# environment variable. Precedence (high → low):
#
#   CLI flag  >  env var  >  config file  >  built-in default
#
# Flag form:   --<section>-<key>=<value>      e.g. --hints-min-length=2
# Env  form:   FLASH_<SECTION>_<KEY>=<value>  e.g. FLASH_HINTS_MIN_LENGTH=2
# Config path: --config=<path> / FLASH_CONFIG=<path>
#
# Source of truth for these defaults lives in `Sources/flash/Config/Config.swift`.
# Keep this file in sync with that struct whenever you change a default.

[hints]
# Alphabet used to generate prefix-free hint labels.
# Either a preset token (<qwerty>|<colemak>|<dvorak>) or a literal string of
# ASCII letters (deduped, lowercase, e.g. "asdfghjkl").
keys = "<qwerty>"

# Floor on label length. Force longer labels (and thus alternating-hand
# scoring) by raising this — e.g. min_length = 2 always uses 2-char labels
# even when the target count would fit in 1.
min_length = 1

[overlay]
# Hint chip styling. font_size is in points; colors accept #RRGGBB or #RRGGBBAA.
# Defaults mirror Vimium's classic yellow hint marker — small bold label on a
# vertical gradient with a darker amber border. Set hint_bg_top == hint_bg_bottom
# for a flat fill.
font_size = 12
hint_fg = "#302505"
hint_bg_top = "#FFF785"
hint_bg_bottom = "#FFC542"
hint_border = "#E3BE23"

# Dismissal is not configurable: the overlay always disappears on
# Escape, Space, any arrow key, or any scroll event. Re-invoking the
# show_hints URL while hints are visible cancels them and starts a
# fresh walk.

[debug]
# Set to true to draw the raw detected rect for every target alongside its
# hint chip. Useful when diagnosing missing or misplaced hints.
show_bounds = false

# Fill + stroke for the debug outline rectangle. Default is transparent
# fill with a pink stroke.
bounds_bg = "#00000000"
bounds_fg = "#FF3B9A"

# Emit a profiling trace for every activation and background precompute.
# Traces are written to stderr (~/Library/Logs/Flash/ in the installed app).
profile = false

# Log activation profiles whose end-to-end latency is at least this many
# milliseconds, even when profile=false. Set to 0 to disable slow logs.
slow_ms = 100

# When true, the AX walker writes one line per visited element
# (role, subrole, frame, parent role, actions, label) to
# `~/Library/Logs/Flash/ax-dump.log` on every activation. Used to
# diagnose missing or spurious hints in apps that fall through to the AX
# provider (Firefox web pages, Electron, etc.). The file is rewritten on
# each activation. Verbose — keep off for normal use.
dump_ax = false

# When true, mirrors every stderr diagnostic line Flash writes (profile
# traces, accessibility-permission warnings, etc.) to
# `~/Library/Logs/Flash/flash.log`. Appended across activations. Useful
# when running Flash via launchd where stderr isn't attached to a
# terminal.
dump_logs = false

# Performance behaviours (AX-event-driven prepared model, concurrent
# subtree walk, parallel deferred action-name IPC) are always on and
# not configurable. See AGENTS.md → "Prepared model contract" for the
# determinism invariants. No per-IPC AX timeout is ever set — caps
# tight enough to be useful tripped Firefox's lazy AXWebArea build.

# App-switching hotkeys. The key is the hotkey string — modifiers and
# the key joined by `+`, the last token is the key. Supported modifiers
# (case-insensitive): cmd, shift, ctrl, alt (aka opt/option). Supported
# keys: a-z, 0-9, ANSI punctuation single chars, named keys (return,
# tab, space, escape, delete, arrows, home/end, pageup/down), or 0xNN
# raw virtual-key.
#
# Values are app names or bundle IDs. Both resolve via NSWorkspace.
# Carbon RegisterEventHotKey catches the keypress system-level, the
# cached NSRunningApplication is activated directly — sub-10ms.
#
# Examples (none enabled by default):
#
#   [shortcuts]
#   "cmd+ctrl+a" = "Alacritty"
#   "cmd+shift+r" = "Reminders"
#   "cmd+ctrl+s" = "com.tinyspeck.slackmacgap"
[shortcuts]
