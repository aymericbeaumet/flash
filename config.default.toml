# Flash default configuration.
#
# This file is the canonical reference for the user-facing configuration
# sections Flash accepts. Copy the keys you want to edit into:
#
#   $XDG_CONFIG_HOME/flash/flash.toml
#   ~/.config/flash/flash.toml
#
# The active file is watched for live reload.

[hints]
# Alphabet used to generate prefix-free hint labels.
# Either a layout selector token or a literal string of ASCII letters.
# Layout selector syntax: <$layout[_$row][_$hand]+...>
#   layouts: qwerty, colemak, dvorak
#   rows: homerow, toprow, bottomrow
#   hands: lefthand, righthand
keys = "<qwerty_homerow+qwerty_toprow>"

# Floor on label length. Force longer labels by raising this.
min_length = 1

# Modifiers that can be held on the final hint key and forwarded to the click.
# Supported names: "cmd", "ctrl", "alt", "shift".
magic_modifiers = ["cmd", "ctrl", "alt", "shift"]

# Selection steps for flash://mouse_grid. The grid is always a square
# NxN with N the largest odd integer such that N*N <= alphabet length
# (so a 25-letter alphabet lands on 5x5). Each selection zooms into a
# cell and re-tiles it with the same grid. Larger step counts give
# finer precision at the cost of more keystrokes. Valid range: 2–6.
mouse_grid_steps = 3

# Opacity (0.0..1.0) applied to every mouse-grid chip. 1.0 = fully
# opaque, 0.0 = invisible. The grid fills the screen during a precision
# click, so a slight translucency keeps the underlying app visible.
mouse_grid_opacity = 0.5

[open]
# App candidates hidden from :open and flash://app_open?name=...
# Entries match display name, bundle identifier, bundle path, .app filename,
# or app filename without .app, case-insensitively.
ignored_apps = []

[plugins]
# Official bundled plugins are always enabled in this version.
# Third-party plugins are loaded only when listed here.
# Supported references:
#   github:user/project
#   file:<path>
third_party = []

# When true (the default), each plugin's directory tree is watched and a
# file change triggers a plugin reload. Set to false to disable
# hot-reload across every plugin.
watching_enabled = true

[mode]
# Labels shown in the mode overlay. The overlay width is based on the
# longest configured label, so compact labels such as N/I/C shrink it.
labels = { normal = "NORMAL", insert = "INSERT", command = "COMMAND" }

# Time (in ms) the interpreter waits for the next key in a pending
# sequence before resolving the longest matching prefix. Equivalent to
# Vim's `timeoutlen`. Lower = faster commit but more two-key collisions;
# higher = slower commit but fewer surprises. Matches Neovim's
# `timeoutlen` default of 1000.
sequence_timeout_ms = 1000

[mode.all.mappings]
# Mappings available in insert and normal modes.
# Values can be quoted flash:// actions or explicit argv arrays. Bare shell
# strings and non-Flash URLs are rejected; use ["open", ...] / ["sh", ...]
# when a mapping needs to launch an external command.
# Relative argv paths containing "/" are resolved from this config file.
#
# Native modified-key mappings are registered with Carbon only when the key
# contains "+". Non-modified keys are read only by the overlay while Flash is
# capturing normal-mode input.
#
# Examples:
# "ctrl+space" = "flash://mouse_target"
# "ctrl+alt+n" = "flash://mode_normal" # enables advanced mode
# "cmd+ctrl+a" = "flash://app_open?name=Alacritty"
# "alt+h" = "flash://window_move?position=lefthalf"
# "alt+n" = "flash://window_move?screen=+1"
# "alt+shift+c" = ["sh", "~/bin/toggle-colors"]

[mode.normal]
# Normal-mode sequence prefix. Use it in normal mappings as <leader>.
leader = "\\"

[mode.normal.mappings]
# Entries here extend the built-in normal-mode map. Reusing a key overrides
# that one default mapping; unrelated defaults stay available.
# Example:
# "<leader>c" = ["../../scripts/toggle_caffeinate.sh"]
"h" = "flash://scroll_left"
"j" = "flash://scroll_down"
"k" = "flash://scroll_up"
"l" = "flash://scroll_right"
"ctrl-e" = "flash://scroll_down"
"ctrl-y" = "flash://scroll_up"
"ctrl-d" = "flash://scroll_half_page_down"
"ctrl-u" = "flash://scroll_half_page_up"
"gg" = "flash://scroll_top"
"G" = "flash://scroll_bottom"
"[h" = "flash://history_back"
"]h" = "flash://history_forward"
"[t" = "flash://tab_previous"
"]t" = "flash://tab_next"
# Reorder the current tab. In tmux this swap-windows; in browsers there
# is no portable equivalent so the mapping is a no-op.
"[m" = "flash://tab_move_previous"
"]m" = "flash://tab_move_next"
"[a" = "flash://app_previous"
"]a" = "flash://app_next"
# Reopen the most recently closed tab. Browsers receive ⌘⇧T; tmux has no
# concept of a closed-window history so it returns "unhandled".
"T" = "flash://tab_reopen"
# cmd+tab / cmd+shift+tab shadow the system app switcher while in normal
# mode. Carbon hotkeys are scope-bound, so entering insert mode releases
# the registration and macOS's Dock switcher takes over again.
"cmd+tab" = "flash://app_next"
"cmd+shift+tab" = "flash://app_previous"
"g^" = "flash://tab_first"
"g$" = "flash://tab_last"
"g1" = "flash://tab_select?index=1"
"g2" = "flash://tab_select?index=2"
"g3" = "flash://tab_select?index=3"
"g4" = "flash://tab_select?index=4"
"g5" = "flash://tab_select?index=5"
"g6" = "flash://tab_select?index=6"
"g7" = "flash://tab_select?index=7"
"g8" = "flash://tab_select?index=8"
"g9" = "flash://tab_select?index=9"
"ctrl-o" = "flash://movement_back"
"ctrl-i" = "flash://movement_forward"
"i" = "flash://mode_insert"
"f" = "flash://mouse_target"
"sf" = "flash://mouse_target?secondary=1"
"df" = "flash://mouse_target?double=1"
"mf" = "flash://mouse_target?move=1"
"F" = "flash://mouse_grid"
"sF" = "flash://mouse_grid?secondary=1"
"dF" = "flash://mouse_grid?double=1"
"mF" = "flash://mouse_grid?move=1"
"u" = "flash://app_undo"
"ctrl-r" = "flash://app_redo"
# tmux-aware close: kills the current tmux window in the current session
# when an attached tmux client is focused, otherwise falls back to ⌘W.
"x" = "flash://tab_close"
"n" = "flash://window_new"
# Context-aware new: opens a new tmux window when a tmux client is focused,
# a new browser tab in browsers, otherwise falls back to ⌘T (⌘N for window-
# only terminal bundles like Alacritty without tmux). Stays in normal mode —
# press `i` afterwards if you want to type.
"t" = "flash://tab_new"
"/" = "flash://app_find"
"<leader>space" = "flash://flashlight"
"r" = "flash://app_reload"
"R" = "flash://app_reload?force=1"
"?" = "flash://help_show"
":" = "flash://mode_command"

[mode.insert.mappings]
# Mappings here apply only after insert mode is already active.
# Advanced mode is enabled only by binding flash://mode_normal in [mode.all.mappings].

[debug]
# Set to true to draw the raw detected rect for every target alongside its
# hint chip. Useful when diagnosing missing or misplaced hints.
show_hints_bounds = false

# Fill + stroke for the debug outline rectangle.
hints_bounds_bg = "#00000000"
hints_bounds_fg = "#FF3B9A"

# Accepted values: "trace", "debug", "info", "warn", "error", "fatal".
# Logs are newline-delimited JSON written to stderr and
# ~/Library/Logs/Flash/flash.log. Set "trace" to include AX tree dumps.
log_level = "info"

# Optional loopback-only dense debug page with live logs and Flash/plugin
# state. Set `http_inspector_enabled = true` to start the HTTP server; host is
# restricted to `localhost` / `127.0.0.1` / `::1`.
http_inspector_enabled = false
http_inspector_host = "localhost"
http_inspector_port = 4242
