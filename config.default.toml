# Flash default configuration.
#
# This file is the canonical reference for the user-facing configuration
# sections Flash accepts. Copy the keys you want to edit into:
#
#   $XDG_CONFIG_HOME/flash/flash.toml
#   ~/.config/flash/flash.toml
#

# App-level integration with macOS. Both keys reconcile live on config
# reload: the menu-bar bolt (About / Open Configuration / Quit) appears or
# disappears immediately, and the login item (System Settings → General →
# Login Items → "Flash", via SMAppService) registers or unregisters.
[app]
menu_bar_icon = true
autostart = true

# Which keyboard layout hint labels, mouse-grid keys and NORMAL mappings are
# read on. Keys are matched by where they sit on that layout, so labels keep
# working while a non-Latin input source (Russian, Greek, Hebrew, a CJK input
# method) is selected.
#   "auto"  read keys as typed while the selected source can type Latin
#           letters; otherwise read them on the Latin layout macOS pairs with
#           it (ABC or U.S.), or US-ANSI when there is none.
#   an ID   always read keys on that input source, whatever is selected, e.g.
#           "com.apple.keylayout.US" or "com.apple.keylayout.Colemak".
# The table is rebuilt when the input source changes. `--search` still matches
# the text you actually type. `flash status` shows the source and reference.
keyboard_layout = "auto"

# The active file is watched for live reload.

[hints]
# Alphabet used to generate prefix-free hint labels.
# Either a layout selector token or a literal string of ASCII letters.
# Layout selector syntax: <$layout[_$row][_$hand]+...>
#   layouts: qwerty, colemak, dvorak
#   rows: homerow, toprow, bottomrow
#   hands: lefthand, righthand
keys = "<qwerty_homerow+qwerty_toprow>"

# Floor on label length. Force longer labels by raising this.
min_length = 1

# Modifiers that can be held on the final hint key. Target and mouse-grid clicks
# preserve them consistently; terminal links additionally require Shift so the
# terminal handles the link instead of forwarding the click to its application.
# Supported names: "cmd", "ctrl", "alt", "shift".
magic_modifiers = ["cmd", "ctrl", "alt", "shift"]

# Put the pointer back where it was after a committed click, drag or
# selection, from hints and the grid alike, and after `mouse_repeat`. Off,
# the pointer stays on the target as with a real click. `--move` and
# `mouse_pointer` always move it. NORMAL's scroll keys act at the pointer, so
# with this on they keep scrolling where the pointer was, not the clicked area.
restore_pointer = false

# The `mouse_grid` verb splits the screen like the left half of your
# keyboard: 4 rows x 5 columns, each cell labelled with the key at the same
# position. On QWERTY that is
#
#   1 2 3 4 5
#   q w e r t
#   a s d f g
#   z x c v b
#
# so `1` is the top-left cell and `b` the bottom-right one. Press the key
# where you want to go, then again inside that cell to refine: every step
# uses the same keys, so screen position and key position stay one habit.

# Selection steps for the `mouse_grid` verb. Each selection zooms into a
# cell and re-tiles it with the same keys; the last one clicks. Selection
# also clicks early once cells reach 18 points. Larger step counts give
# finer precision at the cost of more keystrokes. Valid range: 2–6.
mouse_grid_steps = 3

# Grid keys, one string per keyboard row, top row first. Empty derives the
# left-hand block from the `keys` layout: qwerty 12345/qwert/asdfg/zxcvb,
# colemak 12345/qwfpg/arstd/zxcvb, dvorak 12345/',.py/aoeui/;qjkx. A literal
# `keys` string has no layout and gets the qwerty block. Rows need the same
# length (at least 2x2) and unique keys; "`" is reserved. For example:
#   mouse_grid_keys = ["qwer", "asdf", "zxcv"]
mouse_grid_keys = []

# Move the pointer to the centre of the grid region after every step, so
# hover effects follow along. "`" toggles it while the grid is up.
mouse_grid_cursor_follow = false

# Opacity (0.0..1.0) applied to every mouse-grid chip. 1.0 = fully
# opaque, 0.0 = invisible. The grid fills the screen during a precision
# click, so a slight translucency keeps the underlying app visible.
mouse_grid_opacity = 0.5

[overlay]
# Hint chip typography and colors. font_size drives the hint label size
# (chip geometry derives from it); colors are #RRGGBB or #RRGGBBAA.
font_size = 12
# Regular `f` hint chips: text, vertical gradient (set both stops equal
# for a flat fill), and the 1px chip border.
hint_fg = "#302505"
hint_bg_top = "#FFF785"
hint_bg_bottom = "#FFC542"
hint_border = "#E3BE23"
# Chips whose target priority is `important`/`urgent` (tmux panes,
# browser tabs, …) — a red accent against the yellow regular chips. Set
# any field equal to its hint_* counterpart to opt out per surface.
important_hint_fg = "#ECEFF4"
important_hint_bg_top = "#BF616A"
important_hint_bg_bottom = "#5C3940"
important_hint_border = "#BF616A"
# Colored stroke around the focused app's frontmost window while advanced
# mode is on — green in normal, glowing blue in insert, purple in command —
# so the active window is always identifiable (most useful for apps with
# several windows). Set to false to turn it off entirely.
window_border = true
# Stroke width in points, applied to every mode. 0 (the default) keeps the
# per-mode widths: 1 in normal/command, 2 in insert.
window_border_size = 0
# Stroke color (#RRGGBB or #RRGGBBAA), applied to every mode. Empty (the
# default) keeps the per-mode colors above.
window_border_color = ""
# Seconds an alert_show toast stays up when the call passes no explicit
# --duration.
alert_duration = 2.0
# Milliseconds a transient banner (command output, "Copied: ...") stays up.
banner_duration_ms = 700
# Where a hint chip sits relative to its target: "corner" (the target's
# top-left corner, centred on a target barely larger than the chip),
# "center", "above" (on the target's top edge) or "below" (under its bottom
# edge). Chips stay on the target's screen. Only the chip moves: the click
# aims at the same point whatever the placement.
hint_placement = "corner"
# Draw a short ring where each committed click lands (hint, grid,
# mouse_pointer and mouse_repeat clicks). It never delays the click or the
# next key. Handy for demos and screencasts.
click_feedback = false
# "hide" asks macOS to keep the overlay, status bar and popup windows out of
# screenshots, recordings and screen sharing (NSWindow.sharingType = none).
# Best effort: recent macOS capture APIs may still record them.
screen_capture = "show"

[overlay.dark]
# The chip colours above, used while macOS is in dark mode. An empty value
# keeps the [overlay] colour, so an empty table draws the same chips in both
# appearances. For example:
#   hint_bg_top = "#4C566A"
#   hint_bg_bottom = "#3B4252"
#   hint_fg = "#ECEFF4"
hint_fg = ""
hint_bg_top = ""
hint_bg_bottom = ""
hint_border = ""
important_hint_fg = ""
important_hint_bg_top = ""
important_hint_bg_bottom = ""
important_hint_border = ""

[open]
# App candidates hidden from :open and the `app_open --name=...` verb.
# Entries match display name, bundle identifier, bundle path, .app filename,
# or app filename without .app, case-insensitively.
ignored_apps = []
# Directories scanned (recursively) and watched for .app bundles — the
# flashlight's installed-app catalog and the app_open search roots. `~`
# expands to your home. Changes apply live: the watcher re-points and the
# catalog rescans on config reload.
app_directories = [
  "/Applications",
  "/System/Applications",
  "/System/Applications/Utilities",
  "/System/Library/CoreServices",
  "/System/Cryptexes/App/System/Applications",
  "~/Applications",
]

[plugins]
# Official bundled plugins are enabled unless listed in `disabled`.
# Disable `defaults` for a raw host-only experience without built-in
# plugin-layer defaults such as app_save/app_print/document_open/window_new.
disabled = []

# Third-party plugins are loaded only when listed here.
# Supported references:
#   github:user/project@<40-char commit sha>
#   file:<path>
# GitHub references must pin a full 40-char commit SHA — branches and tags are
# rejected because third-party install/start scripts run as the user, and a
# moving ref would let a compromised plugin author land arbitrary code on each
# config reload.
third_party = []

# When true (the default), each plugin's directory tree is watched and a
# file change triggers a plugin reload. Set to false to disable
# hot-reload across every plugin.
watching_enabled = true

# Hard kill for a third-party plugin's install script — a cold cargo
# build on a slow machine can legitimately take minutes.
install_timeout = 120
# initialize reply deadline. The reply is immediate by contract (catalogs
# publish after it), so this only absorbs interpreter startup.
startup_timeout = 5

# Per-plugin settings live in [plugin.<id>] tables (ids are lowercase
# [a-z0-9._-]). Values may be strings, numbers, booleans, or string
# arrays; each plugin documents its own keys. Two keys are host-reserved:
#
#   sandbox = false        # fail-open kill switch: run this plugin
#                          # UNSANDBOXED (logged loudly; last resort)
#   exec_paths = ["/opt/homebrew/bin/spotify_player"]
#                          # extra absolute paths the plugin may exec,
#                          # for user-installed tools the manifest can't
#                          # know the location of
#
# Remote tmux over SSH/Mosh is opt-in per host: only listed hosts are
# inventoried, over the plugin's own noninteractive SSH connections (these can
# prompt an SSH agent or hardware key). Unset, the plugin never runs ssh.
# [plugin.tmux]
# ssh_hosts = ["dev.example.com"] # destinations as typed, without user@
#
# The Claude quota only reads Claude Code's OAuth token; once it expires, the
# quota shows as stale until Claude Code renews it. `true` lets Flash renew it
# and write the rotated token back to Claude Code's store, which can sign
# Claude Code out.
# [plugin.aiproviders]
# refresh_claude_code_credentials = false
#
# The cpu, memory, disks, network, and power status plugins share one display
# setting. `compact` is the default: the bar keeps only the primary percentage
# (or the NET label), while ticking charts and secondary metrics stay in the
# hover popup. `full` opts that plugin's charts/secondary metrics back into the
# bar. Unknown string values log a warning and fall back to `compact`.
#
# [plugin.network]
# summary_mode = "full" # "compact" | "full"

# The processes plugin publishes top_cpu and top_mem: aligned tables of the
# busiest processes by CPU and by resident memory (conky's ${top}), sampled
# every 2 seconds only while a status surface shows one of them.
# [plugin.processes]
# top_count = 5 # rows per table, 1-20

# RSS headlines from the last 24 hours. No requests run until a URL is set.
# Add #{flash.plugin.feed.summary} to a status format for the rotating title,
# segment label, original domain/link, and whole-row article preview popup.
# [plugin.feed]
# label = "NEWS" # defaults to FEED
# url = "https://example.com/feed.xml"
# refresh_interval = 300 # seconds between feed requests
# cycle_interval = 30    # seconds per headline; Flash rotates the carousel

[statusbar]
# Show the persistent top status bar. This switch alone controls the bar's
# visibility — it is independent of advanced mode (enter_normal_mode/leave_mode
# binding). Defaults to false. Enabling it also asks macOS to auto-hide the
# native menu bar, whose band the Flash bar takes over; reaching for the top
# edge still reveals it. Turning the bar off restores the menu bar only if
# Flash was the one that hid it.
enabled = false
# Which displays show the bar: "all" (default, every screen's top band) or
# "primary" (only the main / menu-bar display).
monitor = "all"
# Default poll cadence for named Flash sources. Each source can override it.
# 0 runs once; cycle_interval controls rotation independently of polling.
interval = 5
# Bar text size in points (the mode pill uses the same size).
font_size = 13
# Timeout for one named Flash source run; keep its last successful value on
# timeout. Native #(...) jobs and persistent PTY commands have no such timeout.
command_timeout = 6.0
# Points kept clear on each side of a notch — the real camera housing on a
# notched screen, and the recess the bar draws behind its centre region
# elsewhere. Both are the same width and use this same margin, so the bar lays
# out identically on a notched Mac and an external display. The centre region
# hides entirely on notched screens, where the hardware supplies the gap.
notch_margin = 6
# Hover-popup chrome. Popup bodies use the same inline text styles as the bar;
# these values control their default foreground and surrounding surface.
popup_fg = "#D8DEE9"
popup_bg = "#2E3440F2"
popup_border = "#4C566A"
popup_border_size = 1
popup_corner_radius = 8
popup_padding = 8
popup_max_width = 480
# Gap in points between the pointer and the popup's top edge.
popup_offset = 8
# One tmux 3.7b format string. Alignment and style markers can appear inside
# conditional/option expansions. Newlines in this outer template are ignored.
# Native formats, modifiers, #H/#h aliases, #(...) jobs, styles, and strftime
# use tmux semantics. Missing tmux session/window/pane context is empty.
# Flash supplies flash.mode, flash.date, flash.active_app_name,
# flash.active_bundle_identifier, flash.plugin.<id>.<segment>,
# flash.plugin.loaded_count/ready_count/error_count, flash.source.<name>, and
# flash.history.<name> for a source that keeps a history.
# Colours use the standard xterm palette, ANSI names, or explicit #RRGGBB.
#
# Flash styles: link=URL/nolink, popup=name/nopopup,
# popup=inline:<percent-encoded-rich-text>, breathing/nobreathing,
# pill/nopill, and cyc/nocyc. Native range=user|name binds statusbar.click.
# Values stay plain text unless a plugin intentionally publishes rich status.
template = "#[align=left]#{E:@left}#[align=right]#{T:@right}"

# Native tmux options. @names are tmux user options; E expands a value as a
# format, T additionally expands its strftime codes. Fragments are optional:
# the same text can be written directly in template.
# Named terminal popups can wrap popup-free plugin labels, for example:
# #[popup=cpu]#{flash.plugin.cpu.label}#[nopopup]
# CPU/MEM/DISK labels carry padded percentages; BAT is unpadded; NET carries a padded byte rate.
# AI quota labels are aiproviders.claude_label / aiproviders.codex_label.
[statusbar.options]
"@left" = "#[pill]#{flash.mode}#[nopill]"
"@right" = "#[fg=#EBCB8B]#{flash.date}"
# Example combined metrics:
# "@right" = "#{flash.plugin.cpu.summary} · #{flash.plugin.memory.summary}"

# Named text preserves newlines and opens in a real terminal pager. Source/plugin
# collectors stay shared; focused pagers keep their snapshot until explicit refresh.
[statusbar.popup]
# quota = "#[fg=#EBCB8B,bold]Quota#[default]\n5-hour: 53% remaining"

# A persistent command popup owns a PTY from Flash startup until removal/shutdown,
# even with the status bar hidden. Hover previews hide on leaving the segment;
# right-click any popup segment to pin/focus, including links. Left-click focuses
# unlinked labels; Option-click focuses linked segments.
# Terminal bindings live in [mode.terminal.mappings].
# Exited processes restart after 100ms; repeated immediate exits back off to 30s.
# terminal_restart restarts immediately; hiding preserves the process.
# Shell syntax requires explicit argv, e.g. ["/bin/sh", "-lc", "exec btm"].
# [terminal.system]
# persistent = true
# command = ["btm", "--read_only", "--rate", "2s"]
# columns = 80
# rows = 24
# working_directory = "~"
# env = { LANG = "en_US.UTF-8" }
# Add #[popup=system]System#[nopopup] to any format fragment.

# Use native #(shell command) for asynchronous tmux shell jobs. For explicit
# argv, a poll cadence, or rotating output lines, declare a named Flash source
# and refer to #{flash.source.news}. Relative paths follow the defining file.
# interval=0 runs once; cycle_interval rotates nonempty output lines.
# [statusbar.sources.news]
# command = ["./news.sh"]
# interval = 300
# cycle_interval = 60
#
# history = N (2-512) keeps the last N numeric outputs as
# #{flash.history.<name>}, space-separated and oldest first; other output
# never enters it. It cannot combine with cycle_interval.
# [statusbar.sources.load]
# command = ["/bin/sh", "-c", "sysctl -n vm.loadavg | awk '{print $2}'"]
# interval = 10
# history = 30

# tmux status-line mouse model: a `#[range=user|<name>]…#[norange]` span in
# the template (or in plugin/script output) names an action; this table
# binds the name. Values are a URL string (opened activating) or a
# ["flash", "<verb>", …] action array (same power as a keybinding).
# `#[link=URL]…#[nolink]` remains the shorthand for plain URL spans.
[statusbar.click]
# The bundled power plugin wraps its battery chip in
# #[range=user|bat-prefs], so a click opens the Battery pane.
"bat-prefs" = "x-apple.systempreferences:com.apple.preference.battery"

# Desktop widgets: a status format drawn as stacked lines on the desktop,
# above the wallpaper and below Finder icons and every app window. Widgets are
# click-through and never take focus, so link=, popup= and range= do nothing.
# Each [widgets.<name>] (letters, digits, _ and -) is evaluated beside the bar
# with the same values, sources and #(...) jobs, even while the bar is off; a
# widget whose windows are all covered stops refreshing until it shows again.
# Each line of the template is its own status line: colours carry over, and
# alignment starts again on the left. A trailing backslash joins two lines.
# #{flash.widget.name} is the widget's name and #{flash.widget.columns} its
# width (columns, or max_columns when sized to fit). See docs/widgets.md.
[widgets]
# [widgets.system]
# enabled = true
# template = """
# #[fg=#EBCB8B,bold]#{host_short}#[default]#[align=right]%a %d %b %H:%M
# CPU #{flash.plugin.cpu.percent}%%#{@sep}MEM #{flash.plugin.memory.percent}%%\
# #{@sep}DISK #{flash.plugin.disks.percent}%%
# #[fg=#4C566A]#{R:─,#{flash.widget.columns}}#[default]
# #{flash.plugin.processes.top_cpu}
# """
# screen = "primary"        # "primary", "all", or a display number (1 = leftmost)
# anchor = "top_right"      # top_left, top_centre, top_right, centre_left, centre,
#                           # centre_right, bottom_left, bottom_centre, bottom_right
# gap_x = 24                # points from the anchored edges of the usable frame
# gap_y = 24
# columns = 44              # 0 fits the widest line, up to max_columns
# max_columns = 120
# font = ""                 # an installed monospaced font; "" = system monospaced
# font_size = 13
# line_spacing = 0          # extra points between lines
# fg = "#D8DEE9"            # default text colour, #RRGGBB
# bg = "#2E3440CC"          # #RRGGBB or #RRGGBBAA; the default is transparent
# border = "#00000000"
# border_size = 0
# corner_radius = 8
# padding = 8
# interval = 0              # clock and #(...) refresh seconds; 0 = statusbar.interval
# hide_from_capture = false # best effort: leave it out of screenshots and sharing
# [widgets.system.options]  # local @options over [statusbar.options]
# "@sep" = " · "

[flashlight]
# Frecency (recency-weighted frequency) ranking boost. half_life_days is
# the sticky-vs-fresh dial: past opens fade with this half-life.
# max_boost caps the score bonus (0 disables frecency outright).
frecency_half_life_days = 14.0
frecency_max_boost = 600
# Per-keystroke deadline for live = true plugin sources (file search and
# other catalogs that cannot be kept warm). Live sources never join the
# first paint, so raising this cannot slow the flashlight open.
# Spotlight's first output byte alone routinely takes 500-700 ms.
live_query_timeout_ms = 1000
# Number of suggestion rows shown below the command bar.
suggestion_count = 10
# The default flashlight pool is intentionally location-only: apps, tabs,
# tmux windows, and any plugin-provided location entities.
# Other sources are hidden unless the query includes an explicit @source filter.
# Bonus added to candidates backed by a running process, used as a tiebreaker
# inside the same source.
precedence_alive_bonus = 10

[flashlight.aliases]
# Literal token substitutions applied when the token is followed by
# whitespace. Any leading sigil is part of the key.
# "!g" = "!google"
# "@ft" = "@firefox.tabs"

[flashlight.precedence]
# Optional source-order overrides used as tie-breakers for location rows or
# explicit @source result sets. Keys are source labels or parent prefixes.
# Example:
# tmux = 200
# "firefox.tabs" = 120

[mode]
# Mode labels shown after the active app name in the persistent status bar
# when advanced mode is enabled.
labels = { normal = "NORMAL", insert = "INSERT", command = "COMMAND" }

# Time (in ms) the interpreter waits for the next key in a pending
# sequence before resolving the longest matching prefix. Equivalent to
# Vim's `timeoutlen`. Lower = faster commit but more two-key collisions;
# higher = slower commit but fewer surprises. Matches Neovim's
# `timeoutlen` default of 1000.
sequence_timeout_ms = 1000
# Pixels per horizontal h/l scroll step.
scroll_step = 60
# Mouse-wheel lines per ctrl+e/ctrl+y and ctrl+d/ctrl+u step.
# These scroll at the cursor in every app, including terminals.
scroll_step_lines = 3
scroll_page_lines = 20
# Spread each of those vertical scrolls over this many milliseconds (at
# most 300) as several smaller line events, so the content glides instead of
# jumping. Still line events, so terminals scroll the same distance. A new
# scroll cancels what is left of the previous one; gg / G stay instant.
# 0 (the default) scrolls at once.
scroll_smooth_ms = 0
# Mouse-down-to-up hold on synthesized clicks (ms); some apps need a
# non-zero press to register.
click_hold_ms = 18
# Delay between chords of a multi-key send_key (ms) — terminals and
# remote-desktop apps drop chords sent back-to-back.
send_key_interval_ms = 35

[mode.all.mappings]
# Modified-key mappings available in every mode, including command-line and
# candidate-finder surfaces. Non-modified keys are read only while Flash owns
# normal-mode input, as described below.
# Every value is an argv array. Arrays starting with "flash" or a path whose
# basename is "flash" dispatch the verb in-process; any other head is launched
# as argv (no shell wrap) with `~` and env expansion on each element. Bare
# strings and URLs are rejected.
# A relative executable containing "/" resolves from this config file.
# Remaining arguments stay opaque; set working_directory on sources/terminals
# when their arguments refer to files relative to the configuration directory.
#
# Single modified-key mappings use Carbon. Non-modified keys and sequences
# are read only by the overlay while Flash is capturing normal-mode input.
#
# Examples:
# "cmd+shift+space" = ["flash", "mouse_target"]
# "ctrl+alt+n" = ["flash", "leave_mode"] # enables advanced mode; shared exit shortcut
# "cmd+ctrl+i" = ["flash", "enter_insert_mode"]
# "cmd+ctrl+semicolon" = ["flash", "enter_command_mode"]
# leave_mode returns INSERT to NORMAL and closes command panels, respecting
# --restore-mode. It does nothing in NORMAL. enter_normal_mode explicitly
# selects NORMAL regardless of a command panel's recorded return mode.
# Mode-specific mappings override the same chord here; no exit override is
# installed by default.
# leave_mode, enter_insert_mode, and enter_command_mode have no default
# mappings in any scope. Define their shortcuts explicitly.
# focus_input also has no default mapping; opt in if focusing a text input
# should enter INSERT (for example, "gi" = ["flash", "focus_input"]).
# "cmd+ctrl+a" = ["flash", "app_open", "--name=Alacritty"]
# "alt+h" = ["flash", "window_move", "--position=lefthalf"]
# Percentage frames require x/y/width/height together. x and y are offsets
# from the Flash-usable frame's top-left; every value must include `%`.
# Flash retains the layout and reapplies it after screen moves or display changes.
# "alt+z" = ["flash", "window_move", "--x=10%", "--y=10%", "--width=80%", "--height=80%"]
# "alt+n" = ["flash", "window_move", "--screen=+1"]
# "alt+shift+c" = ["sh", "~/bin/toggle-colors"]
# The `enter_command_mode` verb opens the command-line panel pre-seeded with
# `--input='<text>'`. Leading colons are stripped and exactly one `:` is
# prepended for the visible prefix; the rest is passed through verbatim,
# so trailing spaces are meaningful — `--input=:flashlight ` opens the
# verb with an empty query while `--input=:flashlight` lists completions
# for verbs starting with `flashlight`. `--restore-mode` restores whichever
# mode was active when the mapping fired. An emoji picker you can trigger
# from INSERT and resume typing afterward:
# "cmd+ctrl+space" = ["flash", "enter_command_mode", "--input=:flashlight @emojis.glyphs ", "--restore-mode"]

[mode.normal]
# Normal-mode sequence prefix. Use it in normal mappings as <leader>.
leader = "\\"

[mode.normal.mappings]
# Defaults use Flash-owned actions and standard macOS editing/scrolling.
# Tabs use [t / ]t to switch, t to open, g1–g9 to send Cmd-1…Cmd-9,
# and [m / ]m to reorder through the source or supported native shortcut.
# Other tab, split, browser-history, reload, archive, URL and mark commands remain
# available for explicit mappings. Bare d, j and k are unbound.
# Entries extend the defaults; reusing a key overrides that mapping, and
# "<key>" = false removes it (a later layer may map it again). A removed key
# also drops plugin mappings on it; removal applies to this table only.
# Every unmapped key or chord is swallowed in NORMAL.
# Use repeat = true to repeat a sequence by pressing its final key again.
# NORMAL persists. INSERT requires enter_insert_mode, a physical app click,
# or a primary hint or mouse-grid click on an input.
"h" = ["flash", "scroll_left"]
"l" = ["flash", "scroll_right"]
"ctrl+e" = ["flash", "scroll_down"]
"ctrl+y" = ["flash", "scroll_up"]
"ctrl+d" = ["flash", "scroll_half_page_down"]
"ctrl+u" = ["flash", "scroll_half_page_up"]
"gg" = ["flash", "scroll_top"]
"G" = ["flash", "scroll_bottom"]
"[a" = { command = ["flash", "app_previous"], repeat = true }
"]a" = { command = ["flash", "app_next"], repeat = true }
"[t" = { command = ["flash", "send_key", "--keys=cmd+shift+["], repeat = true }
"]t" = { command = ["flash", "send_key", "--keys=cmd+shift+]"], repeat = true }
"t" = ["flash", "send_key", "--keys=cmd+t"]
"g1" = ["flash", "send_key", "--keys=cmd+1"]
"g2" = ["flash", "send_key", "--keys=cmd+2"]
"g3" = ["flash", "send_key", "--keys=cmd+3"]
"g4" = ["flash", "send_key", "--keys=cmd+4"]
"g5" = ["flash", "send_key", "--keys=cmd+5"]
"g6" = ["flash", "send_key", "--keys=cmd+6"]
"g7" = ["flash", "send_key", "--keys=cmd+7"]
"g8" = ["flash", "send_key", "--keys=cmd+8"]
"g9" = ["flash", "send_key", "--keys=cmd+9"]
"g0" = ["flash", "tab_first"]
"g^" = ["flash", "tab_first"]
"g$" = ["flash", "tab_last"]
"[m" = { command = ["flash", "tab_move_previous"], repeat = true }
"]m" = { command = ["flash", "tab_move_next"], repeat = true }
"ctrl+o" = ["flash", "movement_back"]
"ctrl+i" = ["flash", "movement_forward"]
# f clicks normally; F applies the same Command-Shift gesture in every app.
# Terminal links additionally require Shift so the terminal opens the link.
# Lowercase f targets discovered elements, uppercase F targets a screen
# position through the grid. A lowercase prefix picks the click on either:
# none, s(econdary), d(ouble), m(ove). Modifiers ride the final hint key
# (hints.magic_modifiers), so holding cmd+shift on it is a Command-Shift
# click without a binding of its own. A prefix letter must not also be a
# mapping on its own, or that mapping waits for sequence_timeout_ms before
# it fires -- which is why triple click ships unbound: "tf" would stall the
# bare "t" above. To add it, remove "t" first:
#   "t" = false
#   "tf" = ["flash", "mouse_target", "--triple"]
#   "tF" = ["flash", "mouse_grid", "--triple"]
"f" = ["flash", "mouse_target"]
"F" = ["flash", "mouse_grid"]
"sf" = ["flash", "mouse_target", "--secondary"]
"sF" = ["flash", "mouse_grid", "--secondary"]
"df" = ["flash", "mouse_target", "--double"]
"dF" = ["flash", "mouse_grid", "--double"]
"mf" = ["flash", "mouse_target", "--move"]
"mF" = ["flash", "mouse_grid", "--move"]
"u" = ["flash", "app_undo"]
"ctrl+r" = ["flash", "app_redo"]
# x uses the app's native close chord. y/p use the system clipboard unless
# prefixed with a register, e.g. "ay / "ap for register a. y resolves immediately.
"x" = ["flash", "send_key", "--keys=cmd+w"]
"X" = ["flash", "send_key", "--keys=cmd+shift+t"]
# r reloads and R hard-reloads with the app's native chords. Terminals leave
# cmd+r unbound, so there both do nothing instead of typing an r.
"r" = ["flash", "send_key", "--keys=cmd+r"]
"R" = ["flash", "send_key", "--keys=cmd+shift+r"]
"y" = ["flash", "yank_selection"]
"p" = ["flash", "paste"]
"/" = ["flash", "app_find"]
"?" = ["flash", "help_show"]

# Named terminal command templates. persistent defaults to false: a new process
# each time the window opens, and the window closes when that process exits.
# Persistent sessions start with Flash, keep running after the window closes,
# and restart after process exit.
# [terminal.bonsai]
# command = ["bonsai", "hq", "--no-open", "--port", "0"]
# persistent = true
# working_directory = "~"
# columns = 120 # standalone default: 100
# rows = 36 # standalone default: 28
# env = { LANG = "en_US.UTF-8" }
# In [mode.normal.mappings]:
# "'b" = ["flash", "terminal_show", "--name=bonsai"]
# "'t" = ["flash", "terminal_show"] # fresh login shell in the home directory

[mode.insert.mappings]
# Mappings here apply only after insert mode is already active.
# Binding leave_mode or enter_normal_mode in [mode.all.mappings] enables advanced mode.

[mode.command.mappings]
# Optional modified-key overrides while command-line or candidate-finder
# surfaces own the keyboard. All-mode shortcuts remain available by default.

[mode.terminal.mappings]
# Terminal input stays local to the focused window. Plain Escape goes to the TUI.
# Winning INSERT leave_mode / enter_normal_mode bindings are inherited;
# optional terminal mappings override them.
"cmd+q" = ["flash", "terminal_quit"] # stop the child; automatic restart applies
"cmd+r" = ["flash", "terminal_restart"] # restart immediately
"cmd+w" = ["flash", "terminal_dismiss"] # hide; persistent sessions keep running

[debug]
# Set to true to draw the raw detected rect for every target alongside its
# hint chip. Useful when diagnosing missing or misplaced hints.
show_hints_bounds = false

# Fill + stroke for the debug outline rectangle.
hints_bounds_bg = "#00000000"
hints_bounds_fg = "#FF3B9A"

# Accepted values: "trace", "debug", "info", "warn", "error", "fatal".
# Logs are newline-delimited JSON written to stderr and
# ~/Library/Logs/Flash/flash.log. Set "trace" to include AX tree dumps.
log_level = "info"

# Optional loopback-only dense debug page with live logs and Flash/plugin
# state. Set `http_inspector_enabled = true` to start the HTTP server; host is
# restricted to `localhost` / `127.0.0.1` / `::1`.
http_inspector_enabled = false
http_inspector_host = "localhost"
http_inspector_port = 4242
